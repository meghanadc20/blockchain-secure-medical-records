<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Medical History · MedChain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-role="PATIENT" data-page="history" data-title="Medical History">
  <div id="app-root"><div class="app-loading"><div class="state" role="status"><div class="spinner" aria-hidden="true"></div>Loading…</div></div></div>
  <template id="page-content">
    <div class="page-header"><div><h1>Medical history</h1><p>Your records and consultations in one timeline, newest first.</p></div></div>
    <form id="filters" class="card toolbar" style="padding:16px" method="get" action="#" novalidate>
      <div class="form-group" style="margin:0"><label for="type">Show</label><select class="form-control" id="type" name="type"><option value="ALL">Everything</option><option value="CONSULTATION">Consultations</option><option value="RECORD">Records</option></select></div>
      <div class="form-group" style="margin:0"><label for="from">From</label><input class="form-control" id="from" name="from" type="date"></div>
      <div class="form-group" style="margin:0"><label for="to">To</label><input class="form-control" id="to" name="to" type="date"></div>
      <div style="display:flex;gap:8px;align-self:flex-end"><button class="btn btn-primary" type="submit">Apply</button><button class="btn btn-outline" type="reset">Clear</button></div>
    </form>
    <div id="summary" class="muted" style="margin:16px 0 8px"></div>
    <ol id="timeline" class="timeline"></ol>
  </template>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/pages/history.js" defer></script>
</body>
</html>
