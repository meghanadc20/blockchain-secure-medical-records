<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Profile · MedChain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-role="PATIENT" data-page="profile" data-title="Profile">
  <div id="app-root"><div class="app-loading"><div class="state" role="status"><div class="spinner" aria-hidden="true"></div>Loading…</div></div></div>
  <template id="page-content">
    <div class="page-header"><div><h1>My profile</h1><p>Keep your contact details up to date.</p></div></div>
    <div class="grid grid-2">
      <section class="card" aria-labelledby="edit-title">
        <h2 class="card-title" id="edit-title" style="margin-bottom:16px">Edit details</h2>
        <div id="form-alert" class="alert" hidden></div>
        <form id="profile-form" method="post" action="#" novalidate>
          <div class="form-group"><label for="name">Full name</label><input class="form-control" id="name" name="name" autocomplete="name" maxlength="100" required><div class="field-error" data-error-for="name"></div></div>
          <div class="form-group"><label for="phone">Phone</label><input class="form-control" id="phone" name="phone" type="tel" autocomplete="tel" maxlength="20" required><div class="field-error" data-error-for="phone"></div></div>
          
          <button class="btn btn-primary" type="submit" disabled data-requires-js>Save changes</button>
        </form>
      </section>
      <section class="card" aria-labelledby="acct-title">
        <div class="card-header"><h2 class="card-title" id="acct-title">Account</h2><span id="status-badge"></span></div>
        <dl id="account" class="kv"></dl>
        <p class="form-hint" style="margin-top:16px">Your email address identifies your account and cannot be changed here.</p>
      </section>
    </div>
    <section class="card" aria-labelledby="wallet-title" style="margin-top:20px">
      <div class="card-header"><h2 class="card-title" id="wallet-title">Blockchain wallet</h2><span id="wallet-badge"></span></div>
      <p class="muted" style="margin-top:-6px">Sharing and revoking access to your records is signed by <strong>you</strong> in MetaMask and recorded on the project’s <strong>local Ganache test blockchain</strong>. No real money is used. Medical files and details never go on the blockchain — only anonymous identifiers, file fingerprints and permissions.</p>
      <div id="wallet-alert" class="alert" hidden></div>
      <dl class="kv" id="wallet-info" style="margin-bottom:16px"></dl>
      <button class="btn btn-primary" id="wallet-link" type="button" disabled data-requires-js>Connect MetaMask &amp; link wallet</button>
      <details style="margin-top:16px"><summary>First-time MetaMask setup</summary>
        <ol class="muted" style="margin:10px 0 0;padding-left:20px">
          <li>Make sure the local chain is running (<code>npm run chain</code> in the backend folder).</li>
          <li>Click the button above. MetaMask asks to add or switch to <em>Ganache (local test network)</em> — approve it.</li>
          <li>Sign the message. Signing is free and proves the wallet is yours; your wallet then receives a little local <em>test</em> ether to pay for transaction fees.</li>
        </ol></details>
    </section>
  </template>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/vendor/ethers.umd.min.js" defer></script>
  <script src="/js/wallet.js" defer></script>
  <script src="/js/pages/profile.js" defer></script>
  <script src="/js/pages/profile-wallet.js" defer></script>
</body>
</html>
