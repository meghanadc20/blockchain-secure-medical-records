<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Dashboard · Secure Medical Data Sharing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-role="PATIENT" data-page="dashboard" data-title="Dashboard">
  <div id="app-root"><div class="app-loading"><div class="state" role="status"><div class="spinner" aria-hidden="true"></div>Loading…</div></div></div>
  <template id="page-content">
    <div class="page-header"><div><h1 id="welcome">Welcome</h1><p>Your records, the doctors you have authorised, and your access history.</p></div></div>
    <div class="grid grid-3" id="stats" style="margin-bottom:20px"></div>
    <div class="grid grid-2">
      <section class="card" aria-labelledby="pending-title">
        <div class="card-header"><h2 class="card-title" id="pending-title">Pending access requests</h2><a class="btn btn-outline btn-sm" href="/patient/access-requests">Review</a></div>
        <div id="pending"></div>
      </section>
      <section class="card" aria-labelledby="acct-title">
        <div class="card-header"><h2 class="card-title" id="acct-title">Account</h2><a class="btn btn-outline btn-sm" href="/patient/profile">Edit</a></div>
        <dl id="account" class="kv"></dl>
      </section>
    </div>
  </template>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/pages/dashboard.js" defer></script>
</body>
</html>
