<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Consultations · MedChain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-role="DOCTOR" data-page="consultations" data-title="Consultations">
  <div id="app-root"><div class="app-loading"><div class="state" role="status"><div class="spinner" aria-hidden="true"></div>Loading…</div></div></div>
  <template id="page-content">
    <div class="page-header"><div><h1>Consultations</h1><p>Record diagnoses, prescriptions and treatment notes for patients who have approved your access. Entries cannot be edited later — add a new consultation to correct or follow up.</p></div></div>
    <div id="verify-alert" class="alert" hidden></div>
    <section class="card" aria-labelledby="new-title" style="margin-bottom:20px">
      <h2 class="card-title" id="new-title" style="margin-bottom:12px">New consultation</h2>
      <div id="form-alert" class="alert" hidden></div>
      <form id="consult-form" method="post" action="#" novalidate>
        <div class="form-row">
          <div class="form-group"><label for="patientId">Patient</label><select class="form-control" id="patientId" name="patientId" required><option value="">Loading patients…</option></select><div class="field-error" data-error-for="patientId"></div></div>
          <div class="form-group"><label for="consultationDate">Consultation date</label><input class="form-control" id="consultationDate" name="consultationDate" type="date" required><div class="field-error" data-error-for="consultationDate"></div></div>
        </div>
        <div class="form-group"><label for="diagnosis">Diagnosis</label><textarea class="form-control" id="diagnosis" name="diagnosis" rows="2" maxlength="5000"></textarea><div class="field-error" data-error-for="diagnosis"></div></div>
        <div class="form-group"><label for="prescription">Prescription</label><textarea class="form-control" id="prescription" name="prescription" rows="2" maxlength="5000" placeholder="Medicine, dose, frequency, duration"></textarea><div class="field-error" data-error-for="prescription"></div></div>
        <div class="form-group"><label for="treatmentNotes">Treatment notes</label><textarea class="form-control" id="treatmentNotes" name="treatmentNotes" rows="3" maxlength="10000"></textarea><div class="field-error" data-error-for="treatmentNotes"></div></div>
        <p class="form-hint" style="margin-top:-6px;margin-bottom:12px">At least one of diagnosis, prescription or treatment notes is required.</p>
        <button class="btn btn-primary" type="submit" disabled data-requires-js>Save consultation</button>
      </form>
    </section>
    <section aria-labelledby="list-title">
      <div class="toolbar"><h2 class="card-title" id="list-title">My consultations</h2>
        <div><label class="sr-only" for="filter-patient">Filter by patient</label><select class="form-control" id="filter-patient"><option value="">All patients</option></select></div></div>
      <div id="list"></div>
    </section>
  </template>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/pages/consultations-doctor.js" defer></script>
</body>
</html>
