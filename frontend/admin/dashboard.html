<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Dashboard · MedChain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-role="ADMIN" data-page="dashboard" data-title="Dashboard">
  <div id="app-root"><div class="app-loading"><div class="state" role="status"><div class="spinner" aria-hidden="true"></div>Loading…</div></div></div>
  <template id="page-content">
    <div class="page-header"><div><h1 id="welcome">Welcome</h1><p>Platform administration: doctor verification. Administrators cannot view patient medical records.</p></div></div>
    <div class="grid grid-4" id="stats" style="margin-bottom:20px"></div>
    <section class="card" aria-labelledby="queue-title">
      <div class="card-header"><h2 class="card-title" id="queue-title">Waiting for verification</h2><a class="btn btn-outline btn-sm" href="/admin/doctors/pending">View all</a></div>
      <div id="queue"></div>
    </section>
  </template>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/pages/admin-dashboard.js" defer></script>
</body>
</html>
