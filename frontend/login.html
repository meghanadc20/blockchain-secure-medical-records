<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · MedChain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topnav">
    <nav class="container" aria-label="Main">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v6M9 11h6"/></svg></span>
        MedChain
      </a>
      <button class="nav-toggle" aria-controls="nav-links" aria-expanded="false" aria-label="Toggle navigation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <ul class="nav-links" id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/register/patient">Register as Patient</a></li>
        <li><a class="btn btn-primary btn-sm" href="/register/doctor">Register as Doctor</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" class="auth-page">
    <div class="card auth-card">
      <h1>Log in</h1>
      <p class="subtitle">Patients and doctors sign in here.</p>
      <noscript><div class="alert alert-error" role="alert">JavaScript is required to sign in securely. Please enable JavaScript and reload this page.</div></noscript>
      <div id="form-alert" class="alert" hidden></div>
      <form id="login-form" method="post" action="/login" autocomplete="on" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" required maxlength="254">
            <div class="field-error" data-error-for="email"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
              <button type="button" class="password-toggle" aria-controls="password" aria-pressed="false">Show</button>
            </div>
            <div class="field-error" data-error-for="password"></div>
          </div>
        <button class="btn btn-primary btn-block" type="submit" disabled data-requires-js>Log in</button>
      </form>
      <p class="auth-footer">New here? <a href="/register/patient">Register as patient</a> · <a href="/register/doctor">Register as doctor</a></p>
    </div>
  </main>
  <script src="/js/nav.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/pages/auth.js" defer></script>
</body>
</html>
